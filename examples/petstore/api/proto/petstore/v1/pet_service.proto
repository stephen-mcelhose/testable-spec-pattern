syntax = "proto3";

package petstore.v1;

option go_package = "github.com/stephen-mcelhose/testable-spec-pattern/examples/petstore/internal/gen/petstore/v1;petstorev1";

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";

// Pet is a pet available (or formerly available) in the store.
message Pet {
  option (google.api.resource) = {
    type: "petstore.example.com/Pet"
    pattern: "pets/{pet}"
    singular: "pet"
    plural: "pets"
  };

  // The resource name of the pet.
  // Format: pets/{pet}
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The display name of the pet.
  string display_name = 2;

  // The pet's category.
  Category category = 3;

  // URLs of photos of the pet.
  repeated string photo_urls = 4;

  // Tags associated with the pet.
  repeated Tag tags = 5;

  // The pet's availability status.
  PetStatus status = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Category is an embedded type grouping pets.
message Category {
  string display_name = 1;
}

// Tag is an embedded label on a pet.
message Tag {
  string display_name = 1;
}

// PetStatus represents the availability of a pet.
enum PetStatus {
  PET_STATUS_UNSPECIFIED = 0;
  PET_STATUS_AVAILABLE = 1;
  PET_STATUS_PENDING = 2;
  PET_STATUS_SOLD = 3;
}

// UploadPhotoResponse is returned from the UploadPhoto custom method.
message UploadPhotoResponse {
  // The updated pet after the photo was attached.
  Pet pet = 1;
}

// ListPetsRequest is the request for ListPets.
message ListPetsRequest {
  // Maximum number of pets to return. The service may return fewer.
  // If unspecified, at most 50 pets are returned. Maximum is 100.
  int32 page_size = 1;

  // A page token from a previous ListPets call.
  string page_token = 2;

  // A filter expression (AIP-160). Replaces findByStatus and findByTags.
  // Example: status = "PET_STATUS_AVAILABLE"
  // Example: tags.display_name = "golden"
  string filter = 3;
}

// ListPetsResponse is the response for ListPets.
message ListPetsResponse {
  // The pets in this page.
  repeated Pet pets = 1;

  // Token to retrieve the next page. Empty if no further pages.
  string next_page_token = 2;
}

// GetPetRequest is the request for GetPet.
message GetPetRequest {
  // The name of the pet to retrieve.
  // Format: pets/{pet}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "petstore.example.com/Pet"}
  ];
}

// CreatePetRequest is the request for CreatePet.
message CreatePetRequest {
  // The pet to create.
  Pet pet = 1 [(google.api.field_behavior) = REQUIRED];

  // The ID to use for the pet. Becomes the final segment of the pet's name.
  // If omitted, a system-generated ID is used.
  string pet_id = 2;
}

// UpdatePetRequest is the request for UpdatePet.
message UpdatePetRequest {
  // The pet to update. The pet's name field is used to identify the pet.
  Pet pet = 1 [(google.api.field_behavior) = REQUIRED];

  // The list of fields to update. If omitted, all populated fields are updated.
  google.protobuf.FieldMask update_mask = 2;
}

// DeletePetRequest is the request for DeletePet.
message DeletePetRequest {
  // The name of the pet to delete.
  // Format: pets/{pet}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "petstore.example.com/Pet"}
  ];
}

// UploadPhotoRequest is the request for the UploadPhoto custom method.
message UploadPhotoRequest {
  // The name of the pet to attach a photo to.
  // Format: pets/{pet}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "petstore.example.com/Pet"}
  ];

  // The photo data to upload.
  bytes photo_data = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional metadata about the photo.
  string additional_metadata = 3;
}

// PetService manages pets in the petstore.
service PetService {
  // Lists pets. Supports filtering by status and tags via the filter field.
  rpc ListPets(ListPetsRequest) returns (ListPetsResponse) {
    option (google.api.http) = {get: "/v1/pets"};
    option (google.api.method_signature) = "";
  }

  // Gets a pet by name.
  rpc GetPet(GetPetRequest) returns (Pet) {
    option (google.api.http) = {get: "/v1/{name=pets/*}"};
    option (google.api.method_signature) = "name";
  }

  // Creates a pet.
  rpc CreatePet(CreatePetRequest) returns (Pet) {
    option (google.api.http) = {
      post: "/v1/pets"
      body: "pet"
    };
    option (google.api.method_signature) = "pet,pet_id";
  }

  // Updates a pet. Supports partial update via update_mask.
  rpc UpdatePet(UpdatePetRequest) returns (Pet) {
    option (google.api.http) = {
      patch: "/v1/{pet.name=pets/*}"
      body: "pet"
    };
    option (google.api.method_signature) = "pet,update_mask";
  }

  // Deletes a pet.
  rpc DeletePet(DeletePetRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=pets/*}"};
    option (google.api.method_signature) = "name";
  }

  // Uploads a photo for a pet.
  rpc UploadPhoto(UploadPhotoRequest) returns (UploadPhotoResponse) {
    option (google.api.http) = {
      post: "/v1/{name=pets/*}:uploadPhoto"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
}
